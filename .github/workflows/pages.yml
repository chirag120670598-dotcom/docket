name: pages

# Publishes site/ to GitHub Pages on every push to main. The build is the same
# one the tests run, so a page that deploys is a page whose dataset validated.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the site
        run: python tools/build.py
      - name: Fail if the page stopped being self-contained
        run: |
          test -s site/index.html
          if grep -q "<script src=" site/index.html; then
            echo "external script in the published page"; exit 1
          fi
      - name: Add .nojekyll
        run: touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Tell search engines the pages exist
        # Free, no account, and it runs after the new files are live so the
        # submitted URLs actually resolve. IndexNow is a notification, not a
        # guarantee of indexing — Bing and Yandex use it, Google does not.
        continue-on-error: true
        run: |
          python tools/build.py
          sleep 20
          python tools/submit.py
